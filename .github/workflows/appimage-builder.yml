name: Linux Portable AppImage

on:
  push:
    tags:
      - 'v*' # Triggers only on version tags like v1.3.6

# Grants write privileges to create releases and upload binary files
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository files
    - name: Kodları Çek
      uses: actions/checkout@v4

    # 2. Setup the Python runtime environment
    - name: Python Ayarla
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. Install application dependencies and PyInstaller
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # 4. Bundle the Python application and its runtime resources
    - name: Uygulamayı AppDir içine paketle
      run: |
        pyinstaller --noconfirm --clean --onedir --name Doc_Network \
          --add-data "langs:langs" --add-data "icon.png:." doc_network.py
        mkdir -p AppDir/usr/bin
        cp -a dist/Doc_Network/. AppDir/usr/bin/
        cp icon.png AppDir/doc_network.png
        cat << 'EOF' > AppDir/doc_network.desktop
        [Desktop Entry]
        Type=Application
        Name=Doc_Network
        Exec=AppRun
        Icon=doc_network
        Categories=Utility;
        Terminal=false
        EOF
        cat << 'EOF' > AppDir/AppRun
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "$0")")"
        exec "$HERE/usr/bin/Doc_Network" "$@"
        EOF
        chmod +x AppDir/AppRun

    # 5. Download the AppImage packager
    - name: AppImage Hazırla
      run: |
        wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    # 6. Build the AppImage from the self-contained AppDir
    - name: AppImage Derle
      run: |
        ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir
        mv Doc_Network-x86_64.AppImage Doc_Network_Portable-x86_64.AppImage

    # 7. Upload the binary to the GitHub Release
    - name: GitHub Release Olarak Yayınla
      uses: softprops/action-gh-release@v2
      with:
        files: Doc_Network_Portable-x86_64.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
